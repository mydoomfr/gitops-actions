---
name: flux-diff
description: >-
  Render the HelmRelease and Kustomization changes of a pull request with flate and
  keep them in one pull request comment. Needs flux-setup first and pull-requests: write.

inputs:
  path:
    description: Cluster directory holding the Flux bootstrap objects, relative to the repository root
    required: true
  marker:
    description: Tag of the pull request comment, helm-diff to keep updating the comments of the former name
    default: helm-diff
  kustomizations:
    description: >-
      Kustomization changes to list: "auto" those the pull request diff does not show
      (remote,source,shared,edited), "all", "none", or a comma-separated list of those
      reasons, plus "direct" for the ones it shows
    default: auto
  kustomization-skip-kinds:
    description: >-
      Comma-separated kinds left out of the Kustomization diff. CRDs are summarized,
      Secret values are always masked.
    default: Secret
  helmrelease-skip-kinds:
    description: >-
      Comma-separated kinds left out of the HelmRelease diff. Drop CustomResourceDefinition
      to review the CRDs a chart ships, summarized; Secret values are always masked.
    default: Secret,CustomResourceDefinition
  allow-missing-kinds:
    description: >-
      Comma-separated input kinds (Secret, ConfigMap, CustomResourceDefinition) flate may
      render without, with a warning, instead of failing: a substituteFrom or valuesFrom
      object created in the cluster, a source whose credentials CI lacks. Empty to fail.
    default: ""
  comment-when-unchanged:
    description: >-
      Post a comment saying so when nothing renders differently, "false" to only refresh
      an existing comment and stay silent otherwise (any other value posts it)
    default: "true"
  lint:
    description: >-
      Warn, at the top of the comment and as annotations, about changes that will fail the
      reconciliation, such as an immutable field updated, or that delete or leave behind an
      object; "false" to turn it off
    default: "true"
  removal-kinds:
    description: >-
      Comma-separated kinds warned about when Flux deletes one of their objects; empty to
      warn about none. Objects a Kustomization stops managing without deleting them are
      always reported
    default: StatefulSet,PersistentVolumeClaim,Namespace,CustomResourceDefinition,NetworkPolicy
  max-chars:
    description: Size above which a section is replaced by a link to the run summary
    default: "60000"
  token:
    description: Token allowed to write pull request comments
    default: ${{ github.token }}
  author:
    description: Login of the account that owns the comment, the one behind the token
    default: github-actions[bot]

runs:
  using: composite
  steps:
    - name: Render Flux diff
      id: diff
      shell: bash
      env:
        CLUSTER_PATH: ${{ inputs.path }}
        KUSTOMIZATIONS: ${{ inputs.kustomizations }}
        SKIP_KINDS: ${{ inputs.kustomization-skip-kinds }}
        HR_SKIP_KINDS: ${{ inputs.helmrelease-skip-kinds }}
        ALLOW_MISSING_KINDS: ${{ inputs.allow-missing-kinds }}
      run: |
        dir=$RUNNER_TEMP/flux-diff
        mkdir -p "$dir"
        : > "$dir/ks.json"
        unset FLATE_BASE # exported by the flate action, mutually exclusive with --path-orig
        args=()
        if [[ -n $ALLOW_MISSING_KINDS ]]; then args+=(--allow-missing-kinds "$ALLOW_MISSING_KINDS"); fi
        # Render failures still print the other changes, with the failed producers under .suppressed
        hr_args=(${args[@]+"${args[@]}"})
        # Before this input, the docs set FLATE_SKIP_KINDS on the job: a flag would override it
        if [[ -z ${FLATE_SKIP_KINDS:-} || $HR_SKIP_KINDS != Secret,CustomResourceDefinition ]]; then
          hr_args+=(--skip-kinds "$HR_SKIP_KINDS")
        fi
        flate diff hr ${hr_args[@]+"${hr_args[@]}"} --path "pr/$CLUSTER_PATH" --path-orig "base/$CLUSTER_PATH" -o json > "$dir/hr.json" ||
          echo "partial=true" >> "$GITHUB_OUTPUT"
        # A separate run, not `diff all`: a Kustomization failure stays a warning, --skip-kinds spares HelmReleases
        if [[ $KUSTOMIZATIONS != none ]]; then
          if ! flate diff ks "${args[@]}" --skip-kinds "$SKIP_KINDS" --path "pr/$CLUSTER_PATH" --path-orig "base/$CLUSTER_PATH" \
            -o json > "$dir/ks.json"; then
            # Only a warning: a Kustomization flate cannot render must not fail the HelmRelease check
            echo "::warning::flate could not render every Kustomization, see the comment and the logs above"
            echo "ks-partial=true" >> "$GITHUB_OUTPUT"
          fi
          "$GITHUB_ACTION_PATH/../lib/kustomization-scope.sh" "$dir/ks.json" "$PWD/pr" "$PWD/base" "$CLUSTER_PATH" > "$dir/scope.json"
          # The prune setting of the Kustomizations removing an object, for the lint
          "$GITHUB_ACTION_PATH/../lib/kustomization-prune.sh" "$dir/ks.json" "pr/$CLUSTER_PATH" ${args[@]+"${args[@]}"} \
            > "$dir/kustomizations.json"
        fi

    - name: Comment on the pull request
      shell: bash
      working-directory: ${{ runner.temp }}/flux-diff
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        PARTIAL: ${{ steps.diff.outputs.partial || steps.diff.outputs.ks-partial }}
        KS_MODE: ${{ inputs.kustomizations }}
        LINT: ${{ inputs.lint }}
        REMOVAL_KINDS: ${{ inputs.removal-kinds }}
        MAX_CHARS: ${{ inputs.max-chars }}
        MARKER: ${{ inputs.marker }}
        COMMENT_AUTHOR: ${{ inputs.author }}
        COMMENT_WHEN_UNCHANGED: ${{ inputs.comment-when-unchanged }}
      run: |
        lib=$GITHUB_ACTION_PATH/../lib
        if [[ -f scope.json ]]; then export KS_SCOPE=$PWD/scope.json; fi
        if [[ -f kustomizations.json ]]; then export KS_PRUNE=$PWD/kustomizations.json; fi
        "$lib/flux-diff-comment.sh" hr.json ks.json
        if [[ -f noop ]]; then
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          # A no-op must not fail the check, as on a fork whose token cannot comment
          if [[ $COMMENT_WHEN_UNCHANGED != false ]]; then
            "$lib/pr-comment.sh" "$MARKER" comment.md || echo "::warning::could not post the Flux diff comment"
          else
            "$lib/pr-comment.sh" "$MARKER" comment.md --update-only || true
          fi
          exit 0
        fi
        # Step summaries cap at 1 MiB: fall back to the comment-sized version
        if (( $(wc -c < comment-full.md) < 1000000 )); then
          cat comment-full.md >> "$GITHUB_STEP_SUMMARY"
        else
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
        fi
        "$lib/pr-comment.sh" "$MARKER" comment.md

    - name: Fail on incomplete render
      if: ${{ steps.diff.outputs.partial }}
      shell: bash
      run: |
        echo "::error::flate could not render every HelmRelease, see the comment and the logs above"
        exit 1
