---
# A second GitRepository on this same repository, branch only: the diff shows the pull
# request's change, not the remote branch
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fleet-main
  namespace: flux-system
spec:
  interval: 10m
  ref:
    branch: main
  url: https://github.com/example/fleet.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: selfsrc
  namespace: flux-system
spec:
  interval: 1h
  path: ./apps/selfsrc
  prune: true
  sourceRef:
    kind: GitRepository
    name: fleet-main
