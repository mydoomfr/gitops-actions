    - {kind: ClusterRoleBinding, name: shrunk, old: {roleRef: {kind: ClusterRole, name: view}, subjects: [{kind: Group, name: devs}, {kind: User, name: eve}]},
       new: {roleRef: {kind: ClusterRole, name: view}, subjects: [{kind: Group, name: devs}]}}
