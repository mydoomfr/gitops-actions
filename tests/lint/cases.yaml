  changes:
    - {kind: ClusterRoleBinding, name: old-name, old: {roleRef: {kind: ClusterRole, name: view}, subjects: [{kind: Group, name: devs}]}}
    - {kind: ClusterRoleBinding, name: new-name, parent: Kustomization/other, new: {roleRef: {kind: ClusterRole, name: view}, subjects: [{kind: Group, name: devs}]}}
