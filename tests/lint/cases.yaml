    - 'privileged Pod apps/pod (Kustomization flux-system/apps): container `debug` runs privileged'

- name: a removed privileged object is not flagged
  refs: [S1]
  changes:
    - {kind: DaemonSet, old: {spec: {template: {spec: {containers: [{name: cni, securityContext: {privileged: true}}]}}}}}
  expect: []

- name: a workload scaled to zero
  refs: [S3]
  changes:
    - {kind: Deployment, name: scaled, old: {spec: {replicas: 3}}, new: {spec: {replicas: 0}}}
    - {kind: StatefulSet, name: unset, old: {spec: {}}, new: {spec: {replicas: 0}}}
    - {kind: Deployment, name: still, old: {spec: {replicas: 0}}, new: {spec: {replicas: 0, paused: true}}}
    - {kind: Deployment, name: up, old: {spec: {replicas: 0}}, new: {spec: {replicas: 1}}}
  expect:
    - 'replicas-zero Deployment apps/scaled (Kustomization flux-system/apps): `spec.replicas` 3 → 0: no pod runs any more'
    - 'replicas-zero StatefulSet apps/unset (Kustomization flux-system/apps): `spec.replicas` 1 (unset) → 0: no pod runs any more'

- name: a workload created with zero replicas
  refs: [S3]
  changes:
    - {kind: Deployment, new: {spec: {replicas: 0}}}
    - {kind: Deployment, name: default, new: {spec: {}}}
    - {kind: Deployment, name: kruise, apiVersion: apps.kruise.io/v1alpha1, new: {spec: {replicas: 0}}}
  expect:
    - 'replicas-zero Deployment apps/x (Kustomization flux-system/apps): created with `spec.replicas: 0`: no pod runs'

- name: a new ClusterRoleBinding grants its role cluster-wide
