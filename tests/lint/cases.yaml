    - 'rbac-widened ClusterRoleBinding grown (Kustomization flux-system/apps): now also grants `ClusterRole view` cluster-wide to `User eve`'

# Routine updates: only image references and versions change

- name: image and version bumps are routine
  refs: [R1, R2, R3]
  changes:
    - {kind: Deployment, old: {metadata: {labels: {app.kubernetes.io/version: '1.0'}}, spec: {template: {metadata: {labels: {helm.sh/chart: app-1.0.0}},
        spec: {containers: [{name: app, image: 'a:1'}], initContainers: [{name: init, image: 'b:1'}]}}}},
       new: {metadata: {labels: {app.kubernetes.io/version: '1.1'}}, spec: {template: {metadata: {labels: {helm.sh/chart: app-1.1.0}},
        spec: {containers: [{name: app, image: 'a:2'}], initContainers: [{name: init, image: 'b:2'}]}}}}}
    - {kind: HelmRelease, name: app, parent: Kustomization/flux-system,
       old: {spec: {chart: {spec: {version: 1.0.0}}, values: {image: {tag: '1'}, sidecar: {image: {digest: 'sha256:a'}}}}},
       new: {spec: {chart: {spec: {version: 1.1.0}}, values: {image: {tag: '2'}, sidecar: {image: {digest: 'sha256:b'}}}}}}
    - {kind: OCIRepository, name: oci, parent: Kustomization/flux-system, old: {spec: {ref: {tag: 1.0.0}}}, new: {spec: {ref: {tag: 1.1.0}}}}
    - {kind: OCIRepository, name: pinned, parent: Kustomization/flux-system, old: {spec: {ref: {digest: 'sha256:a'}}}, new: {spec: {ref: {digest: 'sha256:b'}}}}
    - {kind: GitRepository, name: git, parent: Kustomization/flux-system, old: {spec: {ref: {tag: v1}}}, new: {spec: {ref: {tag: v2}}}}
    - {kind: HelmRelease, name: inline-oci, parent: Kustomization/flux-system,
       old: {spec: {chart: {spec: {chart: app, ref: {tag: 1.0.0}}}}}, new: {spec: {chart: {spec: {chart: app, ref: {tag: 1.1.0}}}}}}
  expect: []
  routine: true

